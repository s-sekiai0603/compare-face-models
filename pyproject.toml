[project]
name = "compare-face-models"
version = "0.1.0"
description = "顔識別モデル比較ツール: 映像からの顔画像抽出と、顔特徴量モデル/ランドマークモデルごとの類似度比較レポート出力"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PySide6>=6.7",
    "ultralytics>=8.3.179",
    "opencv-python>=4.8",
    "numpy>=1.26,<2.3",
    "lapx>=0.5.5",
    "torch",
    "torchvision",
    # models/ の .engine（premises-security 側の環境で作成）は TensorRT 10.16.0.72 製。
    # エンジンはライブラリのバージョンが完全一致しないと読み込めないため同じ版に固定する
    "tensorrt-cu12==10.16.0.72",
    "onnx>=1.16",
    "onnxslim>=0.1.97",
    "onnxruntime>=1.18",
    "openpyxl>=3.1.5",
    "pillow>=10",       # MTCNN（AdaFace 公式の移植）の画像処理
    "pyyaml>=6",        # CVLFace リポジトリの設定ファイル読込
    # CVLFace（Hugging Face の minchul/cvlface_* を直接読み込む）用
    "huggingface_hub>=0.23",
    "omegaconf>=2.3",
    "timm>=0.9",
    "easydict>=1.10",
    # SimilarityTransform.estimate は skimage 2.2 で削除予定（from_estimate へ移行するまで上限を付ける）
    "scikit-image>=0.21,<2.2",
    # LAFS の重み（Google Drive 配布）の自動取得用
    "gdown>=5.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compare_face"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# GPU(CUDA)版 PyTorch を使用する（Blackwell世代は CUDA 12.8 以上が必要）
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
