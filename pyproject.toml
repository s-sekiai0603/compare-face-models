[project]
name = "verify-appearance-reid"
version = "0.1.0"
description = "外見識別(reid)検証用: 映像からの外見画像抽出ツール"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PySide6>=6.7",
    "ultralytics>=8.3.179",
    "opencv-python>=4.8",
    "numpy>=1.26,<2.3",
    "lapx>=0.5.5",
    "torch",
    "torchvision",
    "tensorrt-cu12>=10.8,<11",
    "onnx>=1.16",
    "onnxslim>=0.1.97",
    "torchreid>=0.2.5",
    "gdown>=6.4.1",
    "openpyxl>=3.1.5",
    "scipy>=1.15.3",
    "tensorboard>=2.21.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verify_reid"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# GPU(CUDA)版 PyTorch を使用する（Blackwell世代は CUDA 12.8 以上が必要）
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
